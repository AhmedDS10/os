<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OwaisOS wolf logo</title>
  <desc id="desc">Symmetrical geometric silver wolf head with cyan glowing eyes inside a teal-to-blue circular frame.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35e8b7"/><stop offset=".48" stop-color="#08c9e8"/><stop offset="1" stop-color="#145bff"/></linearGradient>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%"><stop stop-color="#101d30"/><stop offset="1" stop-color="#030812"/></radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset=".45" stop-color="#aeb9ca"/><stop offset="1" stop-color="#59677d"/></linearGradient>
    <linearGradient id="silver2" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#dce4f0"/><stop offset="1" stop-color="#65748b"/></linearGradient>
    <linearGradient id="darkfur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#526176"/><stop offset="1" stop-color="#172437"/></linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8ffff"/><stop offset=".35" stop-color="#28f6ff"/><stop offset="1" stop-color="#0089ff"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="512" cy="512" r="478" fill="url(#ring)"/>
